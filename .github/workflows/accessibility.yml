name: Lint for ADA issues

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm install

      - name: Install React dependencies
        run: npm install react react-dom @types/react @types/react-dom

      - name: Enable debug logging
        run: echo "NODE_OPTIONS=--trace-warnings" >> $GITHUB_ENV

      - name: Run axe-core lint
        run: npx ts-node --esm src/run-axe.ts

      - name: Run CSS linting
        run: npm run lint:css